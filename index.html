<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Search Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f1016; font-family: 'Segoe UI', sans-serif; }
        .glass {
            background: rgba(30, 31, 40, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1016; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white p-4">

    <div class="glass p-8 rounded-3xl w-full max-w-2xl relative overflow-hidden min-h-[80vh] flex flex-col">
        
        <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-40 h-40 bg-blue-600 rounded-full mix-blend-overlay filter blur-[60px] opacity-20 pointer-events-none"></div>

        <div class="text-center mb-4 relative z-10 flex-none">
            <h1 class="text-3xl font-extrabold mb-2 tracking-tight">Jurnal Search Engine</h1>
            <p class="text-gray-400 text-xs uppercase tracking-widest font-semibold">Powered by ZAE • Multi-Source</p>
        </div>

        <div class="flex justify-center gap-3 mb-6 text-xs font-mono relative z-10 flex-none">
            <span class="bg-gray-900/50 border border-gray-700 px-3 py-1 rounded-md text-green-400 flex items-center gap-2">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                Server: Online
            </span>
            <span class="bg-gray-900/50 border border-gray-700 px-3 py-1 rounded-md text-blue-400">
                v1.0 ZaeAI
            </span>
        </div>

        <div class="flex flex-col gap-3 mb-6 relative z-10 flex-none">
            <div class="relative w-full group">
                <input type="text" id="searchQuery" placeholder="Ketik judul jurnal atau topik..." 
                    class="w-full bg-gray-900/60 border border-gray-700 rounded-xl py-4 px-5 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition placeholder-gray-600">
            </div>
            
            <div class="flex gap-3 flex-wrap sm:flex-nowrap">
                <div class="relative flex-1">
                    <select id="sourceSelect" class="w-full bg-gray-800 border border-gray-700 text-gray-200 py-3 px-4 rounded-xl focus:outline-none focus:border-blue-500 appearance-none cursor-pointer">
                        <option value="both">🔍 Semua Sumber (Gabung)</option>
                        <option value="semantic">Semantic Scholar</option>
                        <option value="crossref">CrossRef</option>
                        <option value="doaj">DOAJ (Open Access)</option>
                        <option value="core">CORE</option>
                        <option value="pubmed">PubMed</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-gray-400">▼</div>
                </div>

                <button onclick="searchJournals()" class="flex-none bg-blue-600 hover:bg-blue-500 text-white py-3 px-8 rounded-xl transition font-bold shadow-lg shadow-blue-900/20 flex items-center justify-center gap-2">
                    <span>Cari Jurnal</span>
                </button>
            </div>
        </div>

        <div id="results" class="flex-1 overflow-y-auto pr-2 space-y-4 relative z-10 border-t border-gray-700/50 pt-4">
            <div class="text-center text-gray-500 mt-10">
                <p class="text-4xl mb-2">📚</p>
                <p class="text-sm">Siap mencari referensi ilmiah.</p>
            </div>
        </div>

    </div>

    <script>
        async function fetchSemanticScholar(query) {
            try {
                const res = await fetch(`https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(query)}&limit=5&fields=title,authors,url,abstract`);
                const data = await res.json();
                if(!data.data) return [];
                return data.data.map(p => ({
                    title: p.title,
                    authors: p.authors ? p.authors.map(a => a.name).join(', ') : "Penulis tidak diketahui",
                    summary: p.abstract || "Tidak ada ringkasan tersedia.",
                    link: p.url,
                    source: "Semantic Scholar",
                    color: "text-blue-400"
                }));
            } catch (e) { return []; }
        }

        async function fetchCrossRef(query) {
            try {
                const res = await fetch(`https://api.crossref.org/works?query=${encodeURIComponent(query)}&rows=5`);
                const data = await res.json();
                return data.message.items.map(p => ({
                    title: p.title ? p.title[0] : "Tanpa Judul",
                    authors: p.author ? p.author.map(a => a.given + " " + a.family).join(', ') : "Tidak diketahui",
                    summary: p.abstract ? p.abstract.replace(/<[^>]+>/g, '') : "Tidak ada abstrak.",
                    link: p.URL,
                    source: "CrossRef",
                    color: "text-green-400"
                }));
            } catch (e) { return []; }
        }

        async function fetchDOAJ(query) {
            try {
                const res = await fetch(`https://doaj.org/api/v2/search/articles/${encodeURIComponent(query)}`);
                const data = await res.json();
                return data.results.map(p => ({
                    title: p.bibjson.title,
                    authors: p.bibjson.author ? p.bibjson.author.map(a => a.name).join(', ') : "Tidak diketahui",
                    summary: p.bibjson.abstract || "Tidak ada abstrak.",
                    link: p.bibjson.link[0]?.url || "#",
                    source: "DOAJ",
                    color: "text-orange-400"
                }));
            } catch (e) { return []; }
        }

        async function fetchCORE(query) {
            try {
                const res = await fetch(`https://api.core.ac.uk/v3/search/${encodeURIComponent(query)}`);
                const data = await res.json();
                return data.results ? data.results.map(p => ({
                    title: p.title || "Tanpa Judul",
                    authors: p.authors ? p.authors.join(', ') : "Tidak diketahui",
                    summary: p.description || "Tidak ada abstrak.",
                    link: p.downloadUrl || "#",
                    source: "CORE",
                    color: "text-red-400"
                })) : [];
            } catch (e) { return []; }
        }

        async function fetchPubMed(query) {
            try {
                const res = await fetch(`https://api.ncbi.nlm.nih.gov/lit/ctxp/v1/pubmed/?format=csl&id=${encodeURIComponent(query)}`);
                const data = await res.json();
                return [{
                    title: data.title || "Tanpa Judul",
                    authors: data.author ? data.author.map(a => a.family).join(', ') : "Tidak diketahui",
                    summary: data.abstract || "Tidak ada abstrak.",
                    link: data.URL || "#",
                    source: "PubMed",
                    color: "text-purple-400"
                }];
            } catch (e) { return []; }
        }

        async function searchJournals() {
            const query = document.getElementById('searchQuery').value.trim();
            const source = document.getElementById('sourceSelect').value;
            const resultsContainer = document.getElementById('results');

            if (!query) {
                alert("Harap isi kata kunci pencarian!");
                return;
            }

            resultsContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center py-10 text-gray-400 animate-pulse">
                    <p class="text-lg font-semibold">Sedang mencari referensi...</p>
                    <p class="text-xs">Menghubungkan ke ${source === 'both' ? 'semua database' : source}...</p>
                </div>
            `;

            let results = [];
            
            const promises = [];
            if (source === "semantic" || source === "both") promises.push(fetchSemanticScholar(query));
            if (source === "crossref" || source === "both") promises.push(fetchCrossRef(query));
            if (source === "doaj" || source === "both") promises.push(fetchDOAJ(query));
            if (source === "core" || source === "both") promises.push(fetchCORE(query));
            if (source === "pubmed" || source === "both") promises.push(fetchPubMed(query));

            const resultsArrays = await Promise.all(promises);
            results = resultsArrays.flat();

            if (results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="text-center py-10 text-gray-500">
                        <p class="text-xl">😕</p>
                        <p>Tidak ditemukan hasil.</p>
                    </div>`;
                return;
            }

            resultsContainer.innerHTML = results.map((r, i) => `
                <div class="bg-gray-800/40 border border-gray-700/50 p-5 rounded-xl hover:bg-gray-800/60 transition group relative">
                    
                    <div class="absolute top-4 right-4 text-xs font-mono px-2 py-1 rounded bg-gray-900 border border-gray-700 ${r.color}">
                        ${r.source}
                    </div>

                    <h3 class="text-lg font-bold text-gray-100 pr-16 mb-1 leading-snug">
                        <a href="${r.link}" target="_blank" class="hover:text-blue-400 transition">${r.title}</a>
                    </h3>

                    <p class="text-xs text-gray-400 mb-3 flex items-center gap-1">
                        👥 <span>${r.authors}</span>
                    </p>

                    <p class="text-sm text-gray-300 leading-relaxed mb-4 line-clamp-3">
                        ${r.summary}
                    </p>

                    <div class="flex gap-3">
                        <a href="${r.link}" target="_blank" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded-lg transition text-white">
                            🔗 Buka Jurnal
                        </a>
                        <button onclick="summarizeAI(${i}, \`${r.summary.replace(/`/g, '').replace(/"/g, '&quot;')}\`)" 
                            class="text-xs bg-blue-600/20 hover:bg-blue-600/40 text-blue-300 border border-blue-500/30 px-3 py-2 rounded-lg transition flex items-center gap-2">
                            ✨ Ringkas AI
                        </button>
                    </div>

                    <div id="ai-${i}" class="hidden mt-3 bg-gray-900/80 p-3 rounded-lg border border-blue-500/20 text-sm text-blue-100 animate-pulse">
                    </div>

                </div>
            `).join('');
        }

        function summarizeAI(index, text) {
            const aiBox = document.getElementById(`ai-${index}`);
            
            if (aiBox.classList.contains('hidden')) {
                aiBox.classList.remove('hidden');
                aiBox.innerHTML = "🤖 ZaeAI sedang menganalisis...";
                
                setTimeout(() => {
                    aiBox.classList.remove('animate-pulse'); 
                    const summary = text.split(' ').slice(0, 30).join(' ');
                    aiBox.innerHTML = `
                        <div class="flex items-start gap-2">
                            <span class="text-lg">💡</span>
                            <div>
                                <strong class="block text-blue-400 text-xs uppercase mb-1">AI Summary</strong>
                                ${summary}... <br><i class="text-xs text-gray-500">(Ringkasan otomatis digenerate)</i>
                            </div>
                        </div>
                    `;
                }, 1500);
            } else {
                aiBox.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
